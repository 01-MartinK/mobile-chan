name: Test Build

on:
  push:
    branches:
      - "**"

concurrency:
  group: test-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-37

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile project
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Stage debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MobileChan-debug.apk

      - name: Publish APK to test-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Debug APK from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo '```'
            git log -1 --pretty=format:'%s%n%n%b' "${GITHUB_SHA}"
            echo
            echo '```'
          } > release-notes.md

          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build \
            MobileChan-debug.apk \
            --title "Test Build" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false \
            --target "${GITHUB_SHA}"
